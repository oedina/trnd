name: Fix Photo Paths

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fix photo paths in data.json
        run: python scripts/fix_photos.py
      - name: Commit fix
        run: |
          git config user.name "SeasonalRank Bot"
          git config user.email "bot@seasonalrank.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Fix photo paths in data.json"
          git push
