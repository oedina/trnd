name: Weekly Trend Update

on:
  schedule:
    - cron: "0 9 * * 1"   # Every Monday 9:00 AM UTC
  workflow_dispatch:        # Manual trigger from Actions tab

jobs:
  update-trends:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytrends requests

      - name: Run trend fetcher
        env:
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY:      ${{ secrets.YOUTUBE_API_KEY }}
          UNSPLASH_ACCESS_KEY:  ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          cd scripts
          python fetch_trends.py

      - name: Commit and push all updates
        run: |
          git config user.name "SeasonalRank Bot"
          git config user.email "bot@seasonalrank.com"
          git add data.json rankings/ images/
          git diff --staged --quiet || git commit -m "📊 Weekly trend update — $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
